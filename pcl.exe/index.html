<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>复活了</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #0a0f1e;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        main {
            width: min(100%, 640px);
            padding: clamp(24px, 6vw, 56px);
            border: 1px solid #30394c;
            border-radius: 24px;
            background: #121a2b;
        }
        h1 {
            margin: 0 0 24px;
            color: #fbbf24;
            font-size: clamp(26px, 5vw, 40px);
            line-height: 1.4;
        }
        p {
            margin: 0;
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }
        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            margin-top: 32px;
            padding: 12px 24px;
            border-radius: 12px;
            background: #fbbf24;
            color: #0a0f1e;
            font-weight: 600;
            text-decoration: none;
        }
        .home-button:hover { background: #fcd34d; }
        .home-button:focus-visible {
            outline: 3px solid #f3f4f6;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <main>
        <h1>复活了</h1>
        <a class="home-button" href="https://mczlf.loft.games/API/pcl.exe">前往复活站下载</a>
        <a class="home-button" href="/">回到MCT主页</a>
    </main>
</body>
</html>
